<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Lightbulb outer shape -->
<ellipse cx="60" cy="50" rx="32" ry="34" fill="#FFF0EB" stroke="#F05A28" stroke-width="2.5"/>
<!-- Bulb base -->
<rect x="48" y="82" width="24" height="10" rx="3" fill="#0A0A0A"/>
<rect x="50" y="92" width="20" height="4" rx="2" fill="#0A0A0A"/>
<rect x="52" y="96" width="16" height="4" rx="2" fill="#0A0A0A"/>
<!-- Gear 1 (center) -->
<circle cx="60" cy="48" r="10" fill="none" stroke="#0A0A0A" stroke-width="2"/>
<circle cx="60" cy="48" r="5" fill="#0A0A0A"/>
<rect x="58" y="36" width="4" height="6" rx="1" fill="#0A0A0A"/>
<rect x="58" y="54" width="4" height="6" rx="1" fill="#0A0A0A"/>
<rect x="48" y="46" width="6" height="4" rx="1" fill="#0A0A0A"/>
<rect x="66" y="46" width="6" height="4" rx="1" fill="#0A0A0A"/>
<!-- Gear 2 (left) -->
<circle cx="46" cy="38" r="7" fill="none" stroke="#F05A28" stroke-width="1.5"/>
<circle cx="46" cy="38" r="3.5" fill="#F05A28"/>
<rect x="44" y="29" width="4" height="4" rx="1" fill="#F05A28"/>
<rect x="44" y="43" width="4" height="4" rx="1" fill="#F05A28"/>
<rect x="37" y="36" width="4" height="4" rx="1" fill="#F05A28"/>
<rect x="51" y="36" width="4" height="4" rx="1" fill="#F05A28"/>
<!-- Gear 3 (right) -->
<circle cx="74" cy="40" r="6" fill="none" stroke="#F05A28" stroke-width="1.5"/>
<circle cx="74" cy="40" r="3" fill="#F05A28"/>
<rect x="72" y="32" width="4" height="3" rx="1" fill="#F05A28"/>
<rect x="72" y="45" width="4" height="3" rx="1" fill="#F05A28"/>
<rect x="66" y="38" width="3" height="4" rx="1" fill="#F05A28"/>
<rect x="79" y="38" width="3" height="4" rx="1" fill="#F05A28"/>
<!-- Connection lines between gears -->
<line x1="53" y1="42" x2="55" y2="44" stroke="#F05A28" stroke-width="1" stroke-dasharray="2 2"/>
<line x1="67" y1="42" x2="65" y2="44" stroke="#F05A28" stroke-width="1" stroke-dasharray="2 2"/>
<!-- Glow effect -->
<circle cx="60" cy="50" r="38" stroke="#F05A28" stroke-width="1" stroke-opacity="0.1" fill="none"/>
</svg>